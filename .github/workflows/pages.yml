name: Publish documentation
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-site/**"
      - "PRIVACY.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "24", cache: npm, cache-dependency-path: docs-site/package-lock.json }
      - run: npm ci --prefix docs-site --ignore-scripts
      - run: npm audit --prefix docs-site --audit-level=high
      - run: npm run docs:build
        env: { DOCS_BASE: "/Discord-Unlocked/" }
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: docs-site/.vitepress/dist, retention-days: 1 }
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: { pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
